[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    quick: Hızlı çekirdek dsp ve pipeline testleri (1-2 saniye)
    e2e: Kapsamlı uçtan uca simülasyon ve stres testleri
    slow: Uzun süren analitik karşılaştırma ve meydan okuma testleri
